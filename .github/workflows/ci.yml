name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  POSTGRES_PASSWORD: ci-demo-password
  DB_PASSWORD: ci-demo-password
  JWT_SECRET: ci-only-jwt-secret-with-at-least-32-bytes

jobs:
  web-quality:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: web

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit test
        run: npm run test:run

      - name: Build
        run: npm run build

  backend-quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Java
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - name: Check whitespace
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch origin "${{ github.base_ref }}" --depth=1000
            if git merge-base "origin/${{ github.base_ref }}" HEAD >/dev/null; then
              git diff --check "origin/${{ github.base_ref }}...HEAD"
            else
              echo "No merge base found; checking latest commit for whitespace."
              git diff-tree --check --no-commit-id -r HEAD
            fi
          else
            git diff-tree --check --no-commit-id --root -r HEAD
          fi

      - name: Check collapsed files
        run: |
          python3 - <<'PY'
          from pathlib import Path

          targets = (
              list(Path("src").rglob("*.java"))
              + list(Path("k6").rglob("*.js"))
              + list(Path("k6").rglob("*.sh"))
              + list(Path("docs").rglob("*.md"))
              + list(Path("monitoring").rglob("*.yml"))
              + list(Path("monitoring").rglob("*.yaml"))
              + list(Path("monitoring").rglob("*.json"))
              + list(Path(".github").rglob("*.yml"))
              + list(Path(".github").rglob("*.yaml"))
              + [Path("README.md")]
          )

          bad = []
          for path in targets:
              if not path.exists():
                  continue
              lines = path.read_text(encoding="utf-8", errors="ignore").splitlines()
              if len(lines) <= 5:
                  bad.append((str(path), len(lines)))

          if bad:
              print("Too-short or collapsed files:")
              for row in bad:
                  print(row)
              raise SystemExit(1)

          print("OK")
          PY

      - name: Check k6 script syntax
        run: |
          bash -n k6/run-all.sh
          node --check k6/helpers.js
          node --check k6/scenario-a.js
          node --check k6/scenario-b.js
          node --check k6/scenario-c.js
          node --check k6/scenario-d.js
          node --check k6/scenario-e.js
          node --check k6/scenario-f.js

      - name: Check monitoring template syntax
        run: |
          python3 -m json.tool monitoring/grafana/dashboards/concert-booking-dashboard.json >/dev/null
          bash -n scripts/capture-monitoring-evidence.sh
          bash -n scripts/monitoring-local-verify.sh
          python3 -m py_compile scripts/validate-monitoring-evidence.py scripts/test-monitoring-evidence-validator.py
          python3 scripts/test-monitoring-evidence-validator.py
          mkdir -p monitoring/.generated
          printf 'dummy-token' > monitoring/.generated/concert-booking.token
          docker compose -f docker-compose.yml config >/dev/null
          docker compose -f docker-compose.yml -f docker-compose.demo.yml config >/dev/null
          docker compose -f docker-compose.yml -f docker-compose.e2e.yml config >/dev/null
          docker compose -f docker-compose.yml -f docker-compose.monitoring.yml config >/dev/null
          docker run --rm \
            --entrypoint promtool \
            -v "$PWD/monitoring:/etc/prometheus" \
            prom/prometheus:v2.55.1 \
            check config /etc/prometheus/prometheus.yml
          docker run --rm \
            --entrypoint promtool \
            -v "$PWD/monitoring:/etc/prometheus" \
            prom/prometheus:v2.55.1 \
            check config /etc/prometheus/prometheus.local.yml
          docker run --rm \
            --entrypoint promtool \
            -v "$PWD/monitoring:/etc/prometheus" \
            prom/prometheus:v2.55.1 \
            test rules /etc/prometheus/alert-rules.test.yml

      - name: Check docs evidence policy
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path

          sources = [Path("README.md")] + list(Path("docs").rglob("*.md"))
          text = "\n".join(path.read_text(encoding="utf-8", errors="ignore") for path in sources)

          disallowed = ["스모크 확인", "시나리오 추가"]
          for phrase in disallowed:
              if phrase in text:
                  raise SystemExit(f"Use the portfolio evidence taxonomy instead of '{phrase}'")

          for scenario in ("D Payment Expiration Race", "E Duplicate Request / Idempotency", "F Queue Token Abuse"):
              if re.search(rf"{re.escape(scenario)}[^\n|]*\|[^\n]*측정 완료", text):
                  raise SystemExit(f"{scenario} must not be promoted to 측정 완료 without repeated benchmark evidence")

          readme = Path("README.md").read_text(encoding="utf-8", errors="ignore")
          required_image = "docs/assets/architecture/overall-architecture.svg"
          if required_image not in readme:
              raise SystemExit(f"README.md must reference {required_image}")

          architecture_assets = Path("docs/assets/architecture")
          raster_assets = [
              path for path in architecture_assets.rglob("*")
              if path.is_file() and path.suffix.lower() in {".png", ".jpg", ".jpeg", ".webp"}
          ]
          if raster_assets:
              raise SystemExit(
                  "Architecture docs must use SVG/drawio, not raster assets: "
                  + ", ".join(str(path) for path in raster_assets)
              )

          print("OK")
          PY

      - name: Inspect k6 scenarios
        run: |
          for scenario in a b c d e f; do
            docker run --rm \
              -v "$PWD:/work" \
              -w /work \
              grafana/k6:1.5.0 inspect "k6/scenario-${scenario}.js"
          done

      - name: Test
        run: ./gradlew test --no-daemon

      - name: Build
        run: ./gradlew build --no-daemon

  browser-e2e:
    runs-on: ubuntu-latest
    needs: [backend-quality, web-quality]

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install browser test dependencies
        working-directory: web
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Start E2E stack
        run: docker compose -f docker-compose.yml -f docker-compose.e2e.yml up -d --build --wait web

      - name: Run booking journey
        working-directory: web
        env:
          E2E_BASE_URL: http://localhost:4173
        run: npm run e2e

      - name: Assert clean application log
        run: |
          if docker compose -f docker-compose.yml -f docker-compose.e2e.yml logs --no-color app | grep -E " ERROR |Unhandled exception|Unexpected error"; then
            echo "Application emitted an error during the product journey."
            exit 1
          fi

      - name: Show container logs
        if: failure()
        run: docker compose -f docker-compose.yml -f docker-compose.e2e.yml logs --no-color postgres app web

      - name: Stop E2E stack
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.e2e.yml down -v

  publish-images:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: [backend-quality, web-quality, browser-e2e]
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: app
            context: .
            dockerfile: Dockerfile
            build_args: ""
          - name: web
            context: ./web
            dockerfile: web/Dockerfile
            build_args: VITE_DEMO_MODE=false

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve lowercase image name
        id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}-${{ matrix.name }}" >> "$GITHUB_OUTPUT"

      - name: Build and push SHA-tagged image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.image.outputs.name }}:sha-${{ github.sha }}
          build-args: ${{ matrix.build_args }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
