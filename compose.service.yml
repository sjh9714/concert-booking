services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: concert
      POSTGRES_USER: concert
      POSTGRES_PASSWORD: ${CONCERT_DB_PASSWORD:?}
    ports:
      - "127.0.0.1:${CONCERT_DB_PORT:-15433}:5432"
    volumes:
      - service-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U concert -d concert"]
      interval: 2s
      timeout: 3s
      retries: 20
  app:
    build: .
    environment:
      SPRING_PROFILES_ACTIVE: service,demo
      DB_URL: jdbc:postgresql://postgres:5432/concert
      DB_USERNAME: concert
      DB_PASSWORD: ${CONCERT_DB_PASSWORD:?}
      JWT_SECRET: ${CONCERT_JWT_SECRET:?}
    ports:
      - "127.0.0.1:${CONCERT_API_PORT:-18082}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health"]
      interval: 5s
      start_period: 40s
      timeout: 3s
      retries: 20
  web:
    build:
      context: ./web
      args:
        VITE_DEMO_MODE: 'true'
        VITE_QUEUE_ENABLED: 'false'
    ports:
      - "127.0.0.1:${CONCERT_WEB_PORT:-4176}:80"
    depends_on:
      app:
        condition: service_healthy
volumes:
  service-db:
