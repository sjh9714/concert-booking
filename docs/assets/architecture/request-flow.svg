<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-labelledby="title desc">
<title id="title">좌석 상태와 소유권을 함께 확인</title><desc id="desc">좌석 선택 → 좌석 잠금 → 소유 예약 기록 → 예약 종료. 각 요청에서 예약 상태와 해당 예약이 소유한 좌석을 하나의 DB 트랜잭션으로 변경합니다.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M 0 0 L 8 4 L 0 8" fill="none" stroke="#2563eb" stroke-width="1.5"/></marker></defs>
<rect width="1200" height="440" fill="#ffffff"/>
<g font-family="Pretendard, Noto Sans KR, Apple SD Gothic Neo, sans-serif" fill="#0f172a">
<rect x="48" y="47" width="5" height="39" fill="#2563eb"/><text x="72" y="79" font-size="32" font-weight="700">좌석 상태와 소유권을 함께 확인</text>
<rect x="48" y="160" width="228" height="136" rx="8" fill="#f1f5f9" stroke="#cbd5e1"/><text x="72" y="213" font-size="27" font-weight="700">좌석 선택</text><text x="72" y="254" font-size="19" fill="#475569">여러 좌석 요청</text><path d="M 286 228 H 330" fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow)"/><rect x="340" y="160" width="228" height="136" rx="8" fill="#f1f5f9" stroke="#cbd5e1"/><text x="364" y="213" font-size="27" font-weight="700">좌석 잠금</text><text x="364" y="254" font-size="19" fill="#475569">ID 순서로 잠금</text><path d="M 578 228 H 622" fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow)"/><rect x="632" y="160" width="228" height="136" rx="8" fill="#f1f5f9" stroke="#cbd5e1"/><text x="656" y="213" font-size="27" font-weight="700">소유 예약 기록</text><text x="656" y="254" font-size="19" fill="#475569">currentReservationId</text><path d="M 870 228 H 914" fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow)"/><rect x="924" y="160" width="228" height="136" rx="8" fill="#f1f5f9" stroke="#cbd5e1"/><text x="948" y="213" font-size="27" font-weight="700">예약 종료</text><text x="948" y="254" font-size="19" fill="#475569">결제·취소·만료</text>
<text x="48" y="363" font-size="21" fill="#334155">각 요청에서 예약 상태와 해당 예약이 소유한 좌석을 하나의 DB 트랜잭션으로 변경합니다.</text>
</g></svg>
