<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="900" viewBox="0 0 1280 900" role="img" aria-labelledby="title desc">
  <title id="title">Concert Hall booking product architecture</title>
  <desc id="desc">Three-lane architecture. A React client reaches public catalog and authenticated booking APIs through Nginx. Redis controls queue admission atomically while PostgreSQL remains the reservation source of truth. Transactional outbox events are relayed to Kafka for idempotent seat release, with manual recovery boundaries.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1 1 L9 5 L1 9 Z" fill="#393936" />
    </marker>
    <marker id="coral-arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1 1 L9 5 L1 9 Z" fill="#C8492C" />
    </marker>
    <style>
      .bg{fill:#F6F2EA}.panel{fill:#FFFCF6;stroke:#C8C1B5;stroke-width:1.5}.dark{fill:#1E1E1B;stroke:#1E1E1B}.warm{fill:#FFF0E8;stroke:#C8492C;stroke-width:1.7}.cool{fill:#EDF3F5;stroke:#48646F;stroke-width:1.7}.data{fill:#F0ECE3;stroke:#655E54;stroke-width:1.7}.line{fill:none;stroke:#393936;stroke-width:2;marker-end:url(#arrow)}.accent{fill:none;stroke:#C8492C;stroke-width:2.3;marker-end:url(#coral-arrow)}.dash{stroke-dasharray:7 6}.heading{font:700 28px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#1E1E1B}.lane{font:700 16px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;letter-spacing:1px;fill:#C8492C}.label{font:700 17px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#1E1E1B}.label-inverse{font:700 17px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#FFFCF6}.copy{font:400 14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#4B4842}.copy-inverse{font:400 14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#E8E1D6}.note{font:600 14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#655E54}.flow{font:700 14px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#C8492C}
    </style>
  </defs>

  <rect class="bg" width="1280" height="900" />
  <text class="heading" x="56" y="54">Concert Hall — booking flow and consistency boundaries</text>
  <text class="copy" x="56" y="82">빠른 입장 제어는 Redis, 좌석·예매·결제의 최종 판단은 PostgreSQL, 실패 복구는 Outbox 이벤트 경계로 분리한다.</text>

  <rect class="panel" x="40" y="110" width="1200" height="174" />
  <text class="lane" x="62" y="140">01 · EXPERIENCE</text>
  <rect class="dark" x="72" y="166" width="190" height="82" />
  <text class="label-inverse" x="167" y="198" text-anchor="middle">Browser</text>
  <text class="copy-inverse" x="167" y="222" text-anchor="middle">React · TypeScript</text>
  <rect class="panel" x="330" y="166" width="190" height="82" />
  <text class="label" x="425" y="198" text-anchor="middle">Nginx edge</text>
  <text class="copy" x="425" y="222" text-anchor="middle">SPA · API · SSE proxy</text>
  <rect class="panel" x="594" y="158" width="250" height="98" />
  <text class="label" x="719" y="190" text-anchor="middle">Public discovery</text>
  <text class="copy" x="719" y="215" text-anchor="middle">concerts · schedules · seats</text>
  <text class="note" x="719" y="238" text-anchor="middle">로그인 전 탐색 가능</text>
  <rect class="warm" x="918" y="158" width="250" height="98" />
  <text class="label" x="1043" y="190" text-anchor="middle">Authenticated journey</text>
  <text class="copy" x="1043" y="215" text-anchor="middle">queue → seats → demo payment</text>
  <text class="note" x="1043" y="238" text-anchor="middle">session-scoped JWT</text>
  <path class="line" d="M262 207 H330" /><path class="line" d="M520 207 H594" /><path class="accent" d="M844 207 H918" />

  <rect class="panel" x="40" y="310" width="1200" height="300" />
  <text class="lane" x="62" y="340">02 · SYNCHRONOUS BOOKING</text>
  <rect class="panel" x="72" y="370" width="190" height="92" />
  <text class="label" x="167" y="402" text-anchor="middle">Spring API</text>
  <text class="copy" x="167" y="426" text-anchor="middle">Auth · Catalog</text>
  <text class="copy" x="167" y="448" text-anchor="middle">Reservation · Payment</text>
  <rect class="warm" x="330" y="362" width="224" height="108" />
  <text class="label" x="442" y="394" text-anchor="middle">Queue admission</text>
  <text class="copy" x="442" y="420" text-anchor="middle">ZRANK + token + ZREM</text>
  <text class="flow" x="442" y="446" text-anchor="middle">ONE ATOMIC LUA SCRIPT</text>
  <rect class="cool" x="628" y="354" width="238" height="124" />
  <text class="label" x="747" y="387" text-anchor="middle">Redis</text>
  <text class="copy" x="747" y="414" text-anchor="middle">queue · expiring token</text>
  <text class="copy" x="747" y="438" text-anchor="middle">stock pre-check · seat hold</text>
  <text class="note" x="747" y="462" text-anchor="middle">빠른 제어, 최종 기준 아님</text>
  <rect class="data" x="940" y="354" width="228" height="124" />
  <text class="label" x="1054" y="387" text-anchor="middle">PostgreSQL</text>
  <text class="copy" x="1054" y="414" text-anchor="middle">seat · reservation · payment</text>
  <text class="copy" x="1054" y="438" text-anchor="middle">idempotency key · outbox</text>
  <text class="note" x="1054" y="462" text-anchor="middle">source of truth</text>
  <path class="accent" d="M262 416 H330" /><path class="accent" d="M554 416 H628" /><path class="line" d="M866 416 H940" />
  <rect class="dark" x="330" y="506" width="536" height="76" />
  <text class="label-inverse" x="598" y="532" text-anchor="middle">Reservation transaction</text>
  <text class="copy-inverse" x="598" y="554" text-anchor="middle">token lease → seat lock → PENDING reservation + outbox</text>
  <text class="copy-inverse" x="598" y="574" text-anchor="middle">commit → token consume</text>
  <path class="line" d="M167 462 V545 H330" /><path class="line" d="M866 545 H1054 V478" />

  <rect class="panel" x="40" y="636" width="1200" height="204" />
  <text class="lane" x="62" y="666">03 · ASYNC RECOVERY</text>
  <rect class="data" x="72" y="704" width="188" height="78" />
  <text class="label" x="166" y="735" text-anchor="middle">Outbox rows</text>
  <text class="copy" x="166" y="759" text-anchor="middle">PENDING · FAILED · DEAD</text>
  <rect class="cool" x="326" y="704" width="170" height="78" />
  <text class="label" x="411" y="735" text-anchor="middle">Relay</text>
  <text class="copy" x="411" y="759" text-anchor="middle">retry + backoff</text>
  <rect class="cool" x="562" y="704" width="170" height="78" />
  <text class="label" x="647" y="735" text-anchor="middle">Kafka</text>
  <text class="copy" x="647" y="759" text-anchor="middle">reservation events</text>
  <rect class="warm" x="798" y="704" width="180" height="78" />
  <text class="label" x="888" y="735" text-anchor="middle">Seat release</text>
  <text class="copy" x="888" y="759" text-anchor="middle">idempotent consumer</text>
  <rect class="panel" x="1044" y="694" width="142" height="98" />
  <text class="label" x="1115" y="724" text-anchor="middle">Manual edge</text>
  <text class="copy" x="1115" y="748" text-anchor="middle">DLT replay</text>
  <text class="copy" x="1115" y="770" text-anchor="middle">reconciliation</text>
  <path class="line" d="M260 743 H326" /><path class="line" d="M496 743 H562" /><path class="line" d="M732 743 H798" /><path class="line dash" d="M978 743 H1044" />

  <text class="note" x="56" y="874">Scope: 구현된 로컬 데모와 검증 경계. 운영 배포 토폴로지, 처리량, SLO를 의미하지 않는다.</text>
</svg>
